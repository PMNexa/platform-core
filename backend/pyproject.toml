[project]
name = "platform-core-backend"
version = "0.3.0"
description = "platform-core backend — shared DRF conventions: error contract, pagination, filters, uuid7 utils, and BaseSerializer/BaseViewSet (dynamic field selection + relation sideloading, inspired by dynamic-rest). No models: other modules provide their own."
license = { text = "PolyForm-Shield-1.0.0" }
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "uuid6>=2024.1.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    # OpenAPI 3 (core_api/openapi.py) - modules annotate their views with
    # its @extend_schema, so it's everyone's dependency, not the host's.
    "drf-spectacular>=0.28",
    # Verifying Amazon SNS signatures (platform_system/ses.py).
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core_api*", "platform_system*", "platform_lifecycle*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
